{% if stories %}
<section class="ua-story-quotes" aria-label="Unwinder Stories">
  <p class="ua-story-quotes__eyebrow">UNWINDER STORIES</p>
  <div class="ua-story-quotes__list">
    {% for story in stories %}
    <blockquote class="ua-story-quote">
      <span class="ua-story-quote__mark" aria-hidden="true">“</span>
      <div>
        <h3>{{ story.headline }}</h3>
        <p>{{ story.story }}</p>
      </div>
      <footer><strong>{{ story.name }}</strong></footer>
    </blockquote>
    {% endfor %}
  </div>
</section>
{% endif %}
