services:
  - type: web
    name: unwind-django
    env: python
    rootDir: UnwindAfrica
    region: frankfurt
    plan: 0.5c-512mb
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application
    healthCheckPath: /healthz
    envVars:
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "unwindafrica.com,www.unwindafrica.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://unwindafrica.com,https://www.unwindafrica.com"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: unwind-postgres
          property: connectionString
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: "Unwind Africa <no-reply@unwindafrica.com>"
      - key: USE_CONSOLE_EMAIL
        value: "False"
      - key: WEB_CONCURRENCY
        value: "2"
databases:
  - name: unwind-postgres
    region: frankfurt
    databaseName: unwindafrica
    user: unwindafrica
    plan: 0.1c-256mb
