services:
  - type: web
    name: unwind-africa
    env: docker
    rootDir: .
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: frankfurt
    plan: 0.5c-512mb
    preDeployCommand: python manage.py migrate --noinput
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DJANGO_WORKDIR
        value: .
      - key: DJANGO_INTERNAL_ORIGIN
        value: http://127.0.0.1:8000
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "unwindafrica.com,www.unwindafrica.com,unwind-africa.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://unwindafrica.com,https://www.unwindafrica.com,https://unwind-africa.onrender.com"
      - key: MEDIA_ROOT
        value: "/app/media"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: unwind-postgres
          property: connectionString
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: "Unwind Africa <no-reply@unwindafrica.com>"
      - key: USE_CONSOLE_EMAIL
        value: "False"
      - key: WEB_CONCURRENCY
        value: "1"
    disk:
      name: unwind-media
      mountPath: /app/media
      sizeGB: 1

databases:
  - name: unwind-postgres
    region: frankfurt
    databaseName: unwindafrica
    user: unwindafrica
    plan: 0.1c-256mb
