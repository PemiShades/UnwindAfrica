# Include this file directly inside the HTTPS server block for unwindafrica.com.
# It routes the website and native app API to the already-running Gunicorn on 8001.
client_max_body_size 20m;

location ^~ /static/ {
    alias /srv/unwindafrica/staticfiles/;
    access_log off;
    expires 30d;
    add_header Cache-Control "public, immutable";
}

location ^~ /media/ {
    alias /srv/unwindafrica/media/;
    access_log off;
}

location / {
    proxy_pass http://127.0.0.1:8001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_redirect off;
}
